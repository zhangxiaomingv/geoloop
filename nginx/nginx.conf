# geoloopos.com 前端 —— 营销站静态托管 + 检测 API 反代
# 营销站 6 个静态资源从本地 site/ 服务；其余路径（/api、/report、/deploy 及 app 内部资源）反代到检测容器
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 营销站专属静态资源（精确匹配，优先于反代）
    location = /            { try_files /index.html =404; }
    location = /index.html  { try_files /index.html =404; }
    location = /llms.txt    { try_files /llms.txt =404; }
    location = /sitemap.xml { try_files /sitemap.xml =404; }
    location = /robots.txt  { try_files /robots.txt =404; }
    location = /style.css   { try_files /style.css =404; }
    location = /logo.png    { try_files /logo.png =404; }

    # 其余全部反代到检测容器（/api/*、/report/*、/deploy 等）
    location / {
        proxy_pass http://geoloopos:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 透传真实客户端 IP（Cloudflare CF-Connecting-IP），供检测容器按 IP 限流
        set $xff $remote_addr;
        if ($http_cf_connecting_ip != "") { set $xff $http_cf_connecting_ip; }
        proxy_set_header X-Forwarded-For $xff;
    }
}
