<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>登录 · GEOloopOS 控制台</title>
<style>
  :root {
    --bg: #f6f8fb; --surface: #fff; --border: #e5e9f0; --border-strong: #d3dae5;
    --text: #17233d; --text-muted: #64748b; --text-faint: #94a3b8;
    --primary: #2563eb; --primary-strong: #1d4ed8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px;
  }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
    box-shadow: 0 12px 40px rgba(15, 23, 42, .08);
    width: 100%; max-width: 400px; padding: 34px 30px 30px;
  }
  .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .logo img { width: 26px; height: 26px; border-radius: 7px; }
  .logo-text { font-weight: 720; font-size: 18px; letter-spacing: -.01em; }
  .logo-sub { color: var(--text-faint); font-size: 12px; margin-left: 6px; font-weight: 500; }
  h1 { font-size: 21px; font-weight: 700; margin: 14px 0 6px; letter-spacing: -.01em; }
  p.sub { color: var(--text-muted); font-size: 13px; line-height: 1.6; margin-bottom: 22px; }
  label { display: block; font-size: 12.5px; font-weight: 600; color: var(--text-muted); margin-bottom: 7px; }
  input {
    width: 100%; height: 46px; padding: 0 14px; border: 1px solid var(--border-strong);
    border-radius: 11px; font: inherit; font-size: 14px; color: var(--text);
    background: #fbfcfe; outline: none; letter-spacing: .03em;
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, .12); background: #fff; }
  input::placeholder { color: var(--text-faint); letter-spacing: normal; }
  button {
    width: 100%; height: 46px; margin-top: 16px; border: 0; border-radius: 11px; cursor: pointer;
    background: linear-gradient(135deg, #2563eb, #4c8dff); color: #fff;
    font: inherit; font-size: 15px; font-weight: 600;
    box-shadow: 0 8px 20px rgba(37, 99, 235, .3);
    transition: filter .18s ease, transform .12s ease, box-shadow .18s ease;
  }
  button:hover:not(:disabled) { filter: brightness(1.08); box-shadow: 0 10px 26px rgba(37,99,235,.42); }
  button:active:not(:disabled) { transform: scale(.98); }
  button:disabled { opacity: .55; cursor: not-allowed; }
  .status { margin-top: 14px; font-size: 13px; line-height: 1.5; min-height: 20px; }
  .status.err { color: #dc2626; }
  .status.ok { color: #16a34a; }
  .foot { margin-top: 18px; font-size: 12px; color: var(--text-faint); text-align: center; }
  .foot a { color: var(--text-muted); text-decoration: none; }
  .foot a:hover { color: var(--primary); }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <img src="/logo.png?v=20260904" alt="" />
      <span class="logo-text">GEOloopOS<span class="logo-sub">控制台</span></span>
    </div>
    <h1>登录控制台</h1>
    <p class="sub">输入付费订阅激活码进入。未订阅可前往 <a href="/" style="color:var(--primary);text-decoration:none;">官网</a> 了解。</p>

    <label for="code">激活码</label>
    <input id="code" type="text" autocomplete="off" maxlength="32" spellcheck="false"
      placeholder="GEO-XXXX-XXXX-XXXX" autofocus />
    <button id="btn" type="button">进入控制台</button>
    <div id="status" class="status"></div>
  </div>
  <div class="foot"><a href="/">← 返回官网</a></div>

<script>
(function () {
  var input = document.getElementById("code");
  var btn = document.getElementById("btn");
  var status = document.getElementById("status");
  var busy = false;

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function submit() {
    if (busy) return;
    var code = input.value.trim().toUpperCase();
    if (!code) { status.className = "status err"; status.textContent = "请输入激活码"; return; }
    busy = true;
    btn.disabled = true;
    status.className = "status";
    status.textContent = "验证中…";
    fetch("/api/license/activate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code: code }),
    })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { return { r: r, d: d }; }); })
      .then(function (o) {
        if (o.r.ok && o.d.ok) {
          status.className = "status ok";
          status.textContent = "登录成功，进入控制台…";
          location.href = "/app";
        } else {
          status.className = "status err";
          status.textContent = esc(o.d.message || "激活码无效或已过期");
        }
      })
      .catch(function () {
        status.className = "status err";
        status.textContent = "网络错误，请重试";
      })
      .finally(function () { busy = false; btn.disabled = false; });
  }

  btn.addEventListener("click", submit);
  input.addEventListener("keydown", function (e) { if (e.key === "Enter") submit(); });
})();
</script>
</body>
</html>
