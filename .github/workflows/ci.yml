name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    name: Type-check & smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npx tsc --noEmit

      # No API keys needed — dry-run validates the re-test script's import chain
      # and entity-targeting logic against an empty data dir.
      - name: Re-test dry-run smoke
        run: npm run retest -- --dry
